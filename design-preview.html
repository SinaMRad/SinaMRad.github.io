<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Midnight Blue + Teal | Design Preview</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,Arial,sans-serif;background:#071e2e;color:#fff}
.preview-bar{height:62px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px;background:#0a293c;border-bottom:1px solid #2c6570}
.preview-title{font-weight:750;font-size:14px}.preview-title span{color:#58dfd0}.preview-note{font-size:12px;color:#b9d3d8}
.preview-actions{display:flex;gap:8px;align-items:center}.preview-actions a,.preview-actions button{background:#134b5a;border:1px solid #347784;color:white;border-radius:8px;padding:8px 12px;font:600 12px Inter,Arial,sans-serif;text-decoration:none;cursor:pointer}
.preview-actions button.active{background:#0ba89c;border-color:#0ba89c}
.stage{height:calc(100vh - 62px);display:flex;justify-content:center;background:#dde7e8}
iframe{height:100%;width:100%;border:0;background:#fff;transition:width .2s}
iframe.mobile{width:390px;max-width:100%;box-shadow:0 0 35px #08222b55}
@media(max-width:650px){.preview-note{display:none}.preview-bar{padding:8px}.preview-title{font-size:11px}.preview-actions a,.preview-actions button{font-size:10px;padding:7px}}
</style></head><body>
<header class="preview-bar"><div><div class="preview-title">Sina Rad <span>• Modern Minimal V2 Preview</span></div><div class="preview-note">Preview only — your published design is unchanged</div></div><div class="preview-actions"><button id="desktop" class="active" type="button">Desktop</button><button id="mobile" type="button">Mobile</button><a href="/" target="_blank" rel="noopener">Original ↗</a></div></header>
<div class="stage"><iframe id="site" title="Redesigned website preview" src="/preview-home.html"></iframe></div>
<script>
(function(){
const frame=document.getElementById('site');
function applyTheme(){
 try{
  const doc=frame.contentDocument;
  if(!doc||!doc.head)return;
  if(!doc.getElementById('redesign-preview-styles')){
   const link=doc.createElement('link');link.id='redesign-preview-styles';link.rel='stylesheet';link.href='/css/design-preview.css';doc.head.appendChild(link);
  }
 }catch(e){console.warn('Preview is available only for pages on this website.',e)}
}
frame.addEventListener('load',function(){applyTheme();try{const d=frame.contentDocument;d.addEventListener('click',function(e){const a=e.target.closest('a[href]');if(!a)return;const u=new URL(a.href,location.origin);if(u.origin!==location.origin)return;if(u.pathname==='/'||u.pathname==='/index.html'){e.preventDefault();frame.src='/preview-home.html';}});}catch(e){}});
document.getElementById('mobile').onclick=function(){frame.classList.add('mobile');this.classList.add('active');document.getElementById('desktop').classList.remove('active')};
document.getElementById('desktop').onclick=function(){frame.classList.remove('mobile');this.classList.add('active');document.getElementById('mobile').classList.remove('active')};
})();
</script></body></html>
